<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Charter, Georgia, serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9" fill="none" stroke="#5A6675" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="260" fill="#FFFFFF"/>

  <!-- ① manifold M -->
  <g>
    <path d="M40,175 C55,105 130,70 190,92 C245,112 258,170 218,205 C175,242 95,238 58,212 C42,200 37,190 40,175 Z"
          fill="#EEF1F5" stroke="#5A6675" stroke-width="1.5"/>
    <!-- grid curves on the surface -->
    <path d="M52,150 C110,120 190,118 240,150" fill="none" stroke="#D8DEE6" stroke-width="1.2"/>
    <path d="M50,185 C115,155 185,152 235,182" fill="none" stroke="#D8DEE6" stroke-width="1.2"/>
    <path d="M110,80 C95,130 95,180 112,228" fill="none" stroke="#D8DEE6" stroke-width="1.2"/>
    <path d="M170,84 C158,135 158,185 172,230" fill="none" stroke="#D8DEE6" stroke-width="1.2"/>
    <!-- point X -->
    <circle cx="150" cy="96" r="4.5" fill="#4F63D2"/>
    <text x="160" y="90" font-size="15" font-style="italic" fill="#1B2430">X</text>
    <text x="120" y="252" font-size="15" fill="#1B2430">manifold&#8202;&#160;<tspan font-style="italic">M</tspan></text>
    <text x="58" y="200" font-size="12" fill="#5A6675" font-style="italic">SO(3), SE(3), &#8230;</text>
  </g>

  <!-- exp / log arrows -->
  <g font-size="13" fill="#5A6675">
    <path d="M262,118 L332,118" stroke="#5A6675" stroke-width="1.4" marker-end="url(#arr)"/>
    <path d="M332,150 L262,150" stroke="#5A6675" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="297" y="108" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">log</text>
    <text x="297" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">exp</text>
  </g>

  <!-- ② tangent space -->
  <g>
    <path d="M360,150 L432,110 L520,110 L448,150 Z" fill="#E4E8FA" stroke="#4F63D2" stroke-width="1.5"/>
    <path d="M360,190 L432,150 L520,150 L448,190 Z" fill="none" stroke="#D8DEE6" stroke-width="1"/>
    <circle cx="440" cy="130" r="4" fill="#4F63D2"/>
    <path d="M440,130 L492,118" stroke="#C97B27" stroke-width="2" marker-end="url(#arr)"/>
    <text x="497" y="112" font-size="14" font-style="italic" fill="#C97B27">&#964;</text>
    <text x="400" y="252" font-size="15" fill="#1B2430">tangent space&#160;<tspan font-style="italic">T&#8339;M</tspan></text>
    <text x="382" y="215" font-size="12" fill="#5A6675" font-style="italic">flat &#8212; add / subtract OK</text>
  </g>

  <!-- iso arrows -->
  <g font-size="13" fill="#5A6675">
    <path d="M540,118 L606,118" stroke="#5A6675" stroke-width="1.4" marker-end="url(#arr)"/>
    <path d="M606,150 L540,150" stroke="#5A6675" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="573" y="108" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">&#8744;</text>
    <text x="573" y="172" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">&#8743;</text>
    <text x="573" y="192" text-anchor="middle" font-size="12">&#8773;</text>
  </g>

  <!-- ③ R^n -->
  <g>
    <path d="M640,210 L640,86" stroke="#5A6675" stroke-width="1.4" marker-end="url(#arr)"/>
    <path d="M640,210 L740,210" stroke="#5A6675" stroke-width="1.4" marker-end="url(#arr)"/>
    <path d="M640,210 L700,124" stroke="#C97B27" stroke-width="2" marker-end="url(#arr)"/>
    <text x="706" y="118" font-size="14" font-style="italic" fill="#C97B27">&#964;</text>
    <text x="660" y="252" font-size="15" fill="#1B2430">&#8477;&#8319;</text>
    <text x="646" y="98" font-size="12" fill="#5A6675" font-style="italic">optimization lives here</text>
  </g>
</svg>
