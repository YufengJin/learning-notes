site_name: Yufeng's Learning Notes
site_url: https://yufengjin.github.io/learning-notes/
site_author: Yufeng Jin
site_description: 个人学习笔记知识库 — 数学 / 机器学习 / 机器人 / 阅读
repo_url: https://github.com/YufengJin/learning-notes
repo_name: YufengJin/learning-notes
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  custom_dir: overrides       # 覆盖 site_nav：文章页左栏只显示「目录」+ 返回箭头
  palette:
    scheme: default          # 单一浅色主题（冷灰蓝 + 蓝/琥珀，见 docs/stylesheets/extra.css）
  # font: false —— 不从 Google Fonts 拉字体；正文衬线 / 标题无衬线全部由
  # extra.css 的 --ln-serif / --ln-sans 定义，纯系统字体，离线可用。
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs        # 顶部大分类 tab
    - navigation.sections    # 左侧栏分组展开
    - navigation.indexes     # 分区可有 index 落地页
    - navigation.path        # 顶部面包屑（文件夹结构，可点击任意跳转 / 返回上级）
    - navigation.top         # 回到顶部
    - navigation.tracking    # URL 跟随锚点
    # navigation.instant 与 mkdocs-static-i18n 的语言选择器（Material 原生，右上角
    # header）不兼容 —— 插件自身会在 build 时报 WARNING 并在 --strict 下中断构建，
    # 见 mkdocs_static_i18n/reconfigure.py 的 reconfigure_material_theme()。
    # 已移除以保证双语切换正常工作；其余即时体验保留 navigation.tracking/top。
    - navigation.footer      # 文末上一页/下一页
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips

extra:
  social:
    - icon: fontawesome/solid/note-sticky
      link: /paper-snapshots/
      name: Paper Notes — 论文海报合集
    - icon: fontawesome/brands/github
      link: https://github.com/YufengJin
      name: GitHub

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  # MathJax 3.2.2 自托管（docs/javascripts/vendor/mathjax/，含 woff-v2 字体）——
  # 公式站的命门不走 CDN，与 font: false 的离线原则一致。升级时整目录替换。
  - javascripts/vendor/mathjax/tex-mml-chtml.js
  - javascripts/action-tokenization.js   # robotics 笔记的交互 demo（document$.subscribe 兼容 instant 加载）
  - javascripts/autoregressive-models.js # ml 笔记的交互 demo
  - javascripts/fourier-dct.js           # math 笔记的交互 demo
  - javascripts/fm-solvers.js            # ml/fm-solvers 笔记的交互 demo（流匹配 ODE 求解器）

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 不硬编码 title：交给 Material 语言包（zh=目录 / en=Table of contents），
      # 否则英文站左栏也会显示「目录」。
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret       # 上标 ^^ins^^
  - pymdownx.tilde       # 删除线 ~~del~~ / 下标
  - pymdownx.mark        # 高亮 ==mark==
  - pymdownx.keys        # 键盘键 ++ctrl+c++
  - pymdownx.smartsymbols
  - pymdownx.betterem
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      # CJK 友好的分词分隔符（Material 官方推荐，让中文搜索可用）
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # i18n 声明在 search 之后：插件会接管并按语言重配 search。
  # 语言选择器由插件自动注入 extra.alternate，Material 渲染在右上角 header。
  - i18n:
      docs_structure: suffix        # docs/ml/index.md + docs/ml/index.en.md
      fallback_to_default: true     # 未翻译的页面在 /en/ 下显示中文原文
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          site_name: "Yufeng's Learning Notes"
          site_description: "Personal knowledge base — math / machine learning / robotics / reading"
          nav_translations:
            首页: Home
            机器学习: Machine Learning
            机器人: Robotics
            数学: Mathematics
            阅读: Reading
            "Lie Theory：面向优化与机器人的直观入门": "Lie Theory: An Intuitive Introduction for Optimization and Robotics"
            "Fourier 变换与 DCT：从频域到能量压缩": "Fourier Transform & DCT: From Frequency to Energy Compaction"
            "流匹配 ODE 求解器 · 图解": "Flow Matching ODE Solvers, Illustrated"
            "自回归模型：BERT / GPT 与 Prefix-LM 架构详解": "Autoregressive Models: BERT / GPT and Prefix-LM Architectures Explained"
            "Action Tokenization：把连续动作离散成 token": "Action Tokenization: Discretizing Continuous Actions into Tokens"

nav:
  - 首页: index.md
  - 机器学习:
      - ml/index.md
      - "自回归模型：BERT / GPT 与 Prefix-LM 架构详解": ml/autoregressive-models.md
      - "流匹配 ODE 求解器 · 图解": ml/fm-solvers.md
  - 机器人:
      - robotics/index.md
      - "Action Tokenization：把连续动作离散成 token": robotics/action-tokenization.md
  - 数学:
      - math/index.md
      - "Lie Theory：面向优化与机器人的直观入门": math/lie-theory.md
      - "Fourier 变换与 DCT：从频域到能量压缩": math/fourier-dct.md
  # 「阅读」分区暂无内容，先不进顶部 tab（页面保留在 docs/reading/，首页卡片仍可达；
  # 收录第一篇读书笔记时再把它加回 nav）
  # 样式模板页(style/index.md)不进顶部 tab，仅从首页底部链接

validation:
  nav:
    omitted_files: ignore   # 允许 style/ 不在 nav 中而不报警
